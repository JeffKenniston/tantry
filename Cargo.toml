[workspace]
members = [
    "crates/base",
    "crates/transport",
    "crates/data",
    "crates/iam",
    "crates/permissions",
    "crates/backends",
    "crates/cognitive",
    "crates/repo",
    "crates/runtime",
    "crates/profiles",
    "crates/middleware"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
base = { path = "crates/base" }
iam = { path = "crates/iam" }
permissions = { path = "crates/permissions" }
rpds = "1.1"
quinn = "0.11.12"
quinn-proto = ">=0.11.18"
wasmtime = "43.0.2"
wasmparser = "0.224"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
aes-gcm-siv = "0.12.1"
zstd = "0.14.3"
rkyv = "0.8.18"
rmp-serde = "1.3.1"
serde = "1.0.229"
serde_json = "1.0.154"
parking_lot = "0.12.5"
dashmap = "6.2.1"
zeroize = "1.9.1"
uuid = "1.29.0"
chrono = "0.4.45"
thiserror = "2.0.21"
bytes = "1.12.1"
rand_core = { version = "0.6", features = ["getrandom"] }
