[workspace]
members = ["crates/*"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.dependencies]
rpds = { version = "1.1", features = ["serde"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
quinn-proto = ">=0.11.18"
zstd = { version = "0.13", default-features = false }
