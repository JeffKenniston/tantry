[workspace]
members = [
    "crates/base",
    "crates/transport",
    "crates/data",
    "crates/iam",
    "crates/permissions",
    "crates/backends",
    "crates/cognitive",
    "crates/repo",
    "crates/runtime",
    "crates/profiles",
    "crates/middleware"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
rpds = "1.1"
quinn = "0.11.12"
quinn-proto = ">=0.11.18"
wasmtime = "43.0.2"
wasmparser = "0.224"
