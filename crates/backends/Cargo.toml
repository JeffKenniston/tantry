[package]
name = "backends"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
cap-std = "3.4.1"
thiserror = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bytes = { version = "1", features = ["serde"] }
blake3 = "1"
glob = "0.3.1"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
imara-diff = "0.2.0"
wasmparser = "0.121.2"
nix = { version = "0.28", features = ["process", "signal", "term"] }
wasmtime = { version = "=43.0.2", features = ["component-model", "async", "cranelift"] }
wasmtime-wasi = { version = "=43.0.2" }
tokio = { version = "1", features = ["full"] }
iam = { version = "0.1.0", path = "../iam" }
permissions = { version = "0.1.0", path = "../permissions" }
data = { version = "0.1.0", path = "../data" }
repo = { version = "0.1.0", path = "../repo" }

[dev-dependencies]
tempfile = "3.10.1"
