[package]
name = "base"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1"
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rkyv = { version = "0.8.18", features = ["bytecheck"] }
rmp-serde = "1"
bytecheck = "0.8"
bytes = "1"
blake3 = "1"

[dev-dependencies]
proptest = "1.6.0"
tokio = { version = "1.0", features = ["full"] }
