[package]
name = "base"
version = "0.1.0"
edition = "2024"

[dependencies]
rpds = "1.1"
thiserror = "1"
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rkyv = { version = "0.8.18" }
rmp-serde = "1"
bytes = { version = "1", features = ["serde"] }
blake3 = "1"
toml = "1.1.8"
schemars = "0.8"
smallvec = "1"

[dev-dependencies]
proptest = "1.6.0"
