[package]
name = "base"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
uuid = { version = "1.7", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
blake3 = "1.5"
rkyv = { version = "0.8.18", features = ["bytecheck"] }
rmp-serde = "1.1"
bytecheck = "0.8"
url = "2.5"
