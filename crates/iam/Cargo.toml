[package]
name = "iam"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
blake3 = "1.5"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
rcgen = "0.13"
thiserror = "2.0"
chrono = "0.4.45"
uuid = { version = "1.29.0", features = ["v7"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
ml-dsa = "0.1.1"
dashmap = "6.2.1"
hkdf = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
serde_json = "1.0.154"
hex = "0.4.3"
pkcs8 = { version = "0.11.0", features = ["std"] }
bincode = "1.3.3"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync"] }
getrandom = "0.4.3"
chacha20poly1305 = "0.11.0"
