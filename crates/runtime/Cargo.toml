[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
base = { path = "../base" }
iam = { path = "../iam" }
permissions = { path = "../permissions" }
data = { path = "../data" }
backends = { path = "../backends" }
cognitive = { path = "../cognitive" }
transport = { path = "../transport" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
