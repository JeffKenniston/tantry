[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
prometheus = "0.13"
opentelemetry = "0.27"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
rkyv = "0.8.18"
serde = { version = "1.0.217", features = ["derive"] }
rmp-serde = "1.3.0"
permissions = { version = "0.1.0", path = "../permissions" }
backends = { version = "0.1.0", path = "../backends" }
data = { version = "0.1.0", path = "../data" }
iam = { version = "0.1.0", path = "../iam" }
chrono = "0.4.45"
uuid = { version = "1.29.0", features = ["v7"] }
serde_json = "1.0.154"
