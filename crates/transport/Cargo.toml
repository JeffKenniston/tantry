[package]
name = "transport"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
uuid = { version = "1.29", features = ["v4", "serde"] }
bytes = "1.12"
blake3 = "1.8"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
ml-dsa = "0.1.1"
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rand = "0.8"


[dev-dependencies]
rand_core = "0.10.1"